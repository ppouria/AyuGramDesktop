name: 🐞 Bug report
description: Report errors or unexpected behavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an AyuGram Desktop issue!

        Please provide the details below so the issue can be reproduced. For usage
        questions and support, use https://t.me/ayugramchat instead of opening an issue.
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
      placeholder: Tell us what should happen
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behaviour
      placeholder: Tell us what happens instead
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
      description: |
        Write exact OS (e.g. Windows 11, macOS 14, Ubuntu 24.04 GNOME).
        * 🛑 NO KERNEL VERSIONS (uname)
    validations:
      required: true
  - type: input
    attributes:
      label: Version of AyuGram Desktop
      description: |
        Write the exact version number shown in AyuGram Desktop.
        Do not write "latest".
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Installation source
      multiple: false
      options:
        - Official GitHub release / @AyuGramReleases
        - Winget or Scoop
        - Homebrew
        - Arch Linux AUR (ayugram-desktop / ayugram-desktop-git)
        - Arch Linux AUR (ayugram-desktop-bin)
        - Nix or NixOS
        - Other Linux package
        - Flatpak by 0FL01 (unofficial)
        - Self-built
        - Other (unofficial) source
    validations:
      required: true
  - type: input
    attributes:
      label: Crash ID
      description: |
        If AyuGram Desktop crashed, copy the Crash ID shown by the crash reporter
        on the next launch.
  - type: textarea
    attributes:
      label: Logs
      description: >
        Type `viewlogs` directly into the settings menu to open the logs folder.
        See the [cheat-code documentation](https://github.com/telegramdesktop/tdesktop/wiki/Cheat-Codes).
      placeholder: Insert log.txt here if relevant
      render: shell
